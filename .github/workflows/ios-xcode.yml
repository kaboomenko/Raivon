# Exports the Godot client as an Xcode project for iPhone and uploads it as a downloadable artifact.
# The owner opens Raivon.xcodeproj on the MacBook, picks his Team in Signing & Capabilities and presses Run
# (see docs/testing_on_devices.md). Building an .ipa needs macOS + signing and is done in Xcode.
name: iOS Xcode project

on:
  workflow_dispatch:
  push:
    branches: [claude/funny-maxwell-5e3vez, main]
    # only on version bumps (export_presets.cfg changes) — artifacts are large
    paths: ["game/export_presets.cfg", ".github/workflows/ios-xcode.yml"]

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GODOT_VERSION: 4.5.1
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot and export templates
        run: |
          set -e
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -q -j templates.tpz "templates/ios.zip" "templates/version.txt" -d "$dest"
      - name: Import and export the Xcode project
        run: |
          set -e
          G=./Godot_v${GODOT_VERSION}-stable_linux.x86_64
          $G --headless --path game --import || true
          mkdir -p builds/ios
          $G --headless --path game --export-debug "iOS" ../builds/ios/Raivon.xcodeproj
          test -f builds/ios/Raivon.pck
      - name: Zip
        run: cd builds && zip -qry ../Raivon-ios-xcode.zip ios
      - uses: actions/upload-artifact@v4
        with:
          name: Raivon-ios-xcode
          path: Raivon-ios-xcode.zip
          retention-days: 7
